<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HumanCalc - חידות של תנועה, משקל וכוח</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 HumanCalc ✈️</h1>
            <p class="subtitle">5 חידות על מטוסים, ספינות, משאיות, טילים וכדורים פורחים</p>
        </header>

        <div id="startScreen" class="screen">
            <div class="topics">
                <div class="topic">⏱️ מהירות, זמן ודרך</div>
                <div class="topic">⚖️ משקלים ומחירים</div>
                <div class="topic">💥 כוח ותוצאות</div>
            </div>
            <p class="intro">בכל משחק 5 שאלות. תשובה נכונה = נקודה. תשובה נכונה עם רמז = חצי נקודה.</p>
            <div id="bestScore" class="best-score"></div>
            <button id="startBtn" class="btn-primary">יוצאים לדרך!</button>
        </div>

        <div id="gameScreen" class="screen hidden">
            <div class="progress">
                <span id="progressText"></span>
                <span id="scoreText"></span>
            </div>
            <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>

            <div id="questionCard" class="question-card">
                <div id="questionTopic" class="question-topic"></div>
                <div id="questionIcon" class="question-icon"></div>
                <p id="questionText" class="question-text"></p>

                <div class="answer-row">
                    <input id="answerInput" class="answer-input" type="number" step="any" dir="ltr" placeholder="?">
                    <span id="answerUnit" class="answer-unit"></span>
                </div>

                <div class="button-container">
                    <button id="checkBtn" class="check-btn">בדיקה</button>
                    <button id="hintBtn" class="hint-btn">💡 רמז</button>
                </div>

                <div id="hintBox" class="hint-display"></div>
                <div id="feedback" class="feedback"></div>
                <button id="nextBtn" class="btn-primary next-btn hidden">לשאלה הבאה ←</button>
            </div>
        </div>

        <div id="resultsScreen" class="screen hidden">
            <div class="results-container">
                <div id="resultsTitle" class="results-title"></div>
                <div id="resultsScore" class="results-score"></div>
                <div id="resultsStars" class="celebration"></div>
                <div id="resultsMessage" class="results-message"></div>
                <ul id="resultsList" class="results-list"></ul>
                <button id="againBtn" class="btn-primary">משחק חדש</button>
            </div>
        </div>

        <footer>
            <p>TgSofts +9725914007</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
